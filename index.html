<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>תדריך טיסה</title>
  <meta name="description" content="דפית טיסה מתוך תדריך הטיסה. הכול מחושב על המכשיר. כלי עזר בלבד.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f1efe8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="תדריך טיסה">
  <script>
    // ערכת הצבעים לפני הציור הראשון, כדי שלא יהבהב מסך בהיר במצב כהה.
    try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch { /* אחסון חסום */ }
  </script>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main>
    <section id="home" class="screen">
      <div class="bar">
        <h1>תדריך טיסה</h1>
        <button type="button" class="icon-btn theme-btn" aria-label="מצב בהיר או כהה"></button>
      </div>

      <label class="drop" id="drop">
        <input type="file" accept="application/pdf,.pdf" hidden>
        <span class="drop-title">תדריך</span>
        <span class="drop-sub">קובץ PDF של תדריך הטיסה</span>
        <span class="drop-state">לא נבחר קובץ</span>
        <span class="drop-loaded">
          <button type="button" class="drop-file" title="פתיחת קובץ התדריך">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h6"/></svg>
            <span class="drop-file-text"><span class="drop-label" dir="ltr"></span><span class="drop-name" dir="ltr"></span></span>
            <svg class="ext" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
          </button>
          <span class="drop-actions">
            <button type="button" class="drop-pick">בחר תדריך אחר</button>
            <button type="button" class="drop-sheet">דפית טיסה</button>
          </span>
        </span>
        <span class="drop-error" role="alert"></span>
      </label>

      <div id="float-box" hidden>
        <h2 class="list-title">חלון צף</h2>
        <div class="float-choices">
          <button type="button" class="pri" data-mode="full" aria-pressed="false">דפית מלאה</button>
          <button type="button" class="pri" data-mode="takeoff" aria-pressed="false">המראה</button>
          <button type="button" class="pri" data-mode="cruise" aria-pressed="false">שיוט</button>
        </div>
        <div class="note msg float-msg" role="status" hidden>
        <span class="msg-text"></span>
        <button type="button" class="icon-btn msg-close" aria-label="סגירת ההודעה"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      </div>

      <footer class="foot">
        <span>כלי עזר בלבד</span>
        <span id="app-version"></span>
        <button id="app-update" type="button" hidden></button>
      </footer>
    </section>

    <section id="sheet-view" class="screen" hidden>
      <div class="bar">
        <a href="#" class="back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>חזרה</a>
        <span class="bar-actions">
          <button type="button" id="float-btn" class="pri"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="12" width="7" height="5" rx="1"/></svg><span>חלון צף</span></button>
          <button type="button" class="icon-btn theme-btn" aria-label="מצב בהיר או כהה"></button>
        </span>
      </div>
      <div class="note msg float-msg" role="status" hidden>
        <span class="msg-text"></span>
        <button type="button" class="icon-btn msg-close" aria-label="סגירת ההודעה"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div id="sheet-slot"></div>
      <p id="sheet-away" class="note" hidden>הדפית פתוחה בחלון הצף. אפשר לערוך בה שם.</p>
    </section>
  </main>

  <!-- תדריך מעודכן לאותה טיסה ולאותו מטוס: להשאיר את ה-Loadsheet וה-OPT או לאפס (requirements.md, 5.0). -->
  <dialog id="keep-dlg" class="dlg">
    <form method="dialog">
      <h2 class="dlg-title">תדריך מעודכן לאותה טיסה</h2>
      <p class="dlg-sub">אותו מטוס (<bdi class="dlg-reg"></bdi>). OFP <bdi dir="ltr" class="dlg-ofp"></bdi></p>
      <p class="dlg-sub">הצוות נשמר, ו-B.F חוזר לערך התכנון החדש.</p>
      <p class="dlg-q">יש ערכים מהתדריך הקודם:</p>
      <div class="dlg-vals" dir="ltr"></div>
      <p class="dlg-q">להשאיר אותם או לאפס?</p>
      <div class="dlg-actions">
        <button value="keep" class="pri" autofocus>השאר</button>
        <button value="reset">אפס</button>
      </div>
    </form>
  </dialog>

  <!-- החלון הצף באייפד: הדפית מצוירת על canvas ומוזרמת לווידאו (requirements.md, 5.1.2). -->
  <canvas id="pip-canvas" width="600" height="760" aria-hidden="true"></canvas>
  <video id="pip-video" muted playsinline aria-hidden="true"></video>
</body>
</html>
