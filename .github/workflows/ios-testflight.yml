# בנייה של אפליקציית ה-iOS והעלאה ל-TestFlight. requirements.md, סעיף 6.5.
# הפעלה ידנית בלבד: Actions → "iOS → TestFlight" → Run workflow.
#
# סודות (Settings → Secrets and variables → Actions → Secrets), נכנסים על ידי הבעלים בלבד:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (תוכן קובץ ה-p8)
#   IOS_DIST_CERT_P12 (base64), IOS_DIST_CERT_PASSWORD, IOS_PROFILE (base64 של ה-mobileprovision)
# משתנים (אותו מסך → Variables): IOS_TEAM_ID, IOS_BUNDLE_ID

name: iOS → TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native
    env:
      FB_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      FB_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      FB_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: בדיקת הגדרות
        run: |
          missing=""
          for v in FB_TEAM_ID FB_BUNDLE_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 P12 P12_PASSWORD PROFILE; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::חסרים סודות או משתנים:$missing"; exit 1; fi
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: קבצי האפליקציה ו-Capacitor
        run: |
          npm ci
          npm run sync

      - name: אייקון 1024
        run: sips -s format png -z 1024 1024 ../icons/icon-512.png --out ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png

      - name: תעודה ופרופיל
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          UUID="$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision" | plutil -extract UUID raw -)"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$RUNNER_TEMP/app.mobileprovision" "$d/$UUID.mobileprovision"
          done
          echo "FB_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            FB_TEAM_ID="$FB_TEAM_ID" FB_BUNDLE_ID="$FB_BUNDLE_ID" \
            FB_PROFILE_UUID="$FB_PROFILE_UUID" FB_BUILD_NUMBER="$FB_BUILD_NUMBER"

      - name: העלאה ל-TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$FB_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict><key>$FB_BUNDLE_ID</key><string>$FB_PROFILE_UUID</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: ניקוי
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/app.mobileprovision"
